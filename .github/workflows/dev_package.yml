name: Dev Package
on:
  push:
    branches:
      - master
jobs:
  release:
    name: Create dev package
    runs-on: ubuntu-latest
    env:
      UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
      UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
      UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}
      DIST_DIR: /tmp/signed-upm-dist
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create dev package branch
        run: |
          git branch -d dev-package &> /dev/null || echo dev-package branch not found
          git subtree split -P "$PKG_ROOT" -b dev-package
          mv README.md /tmp/README.md
          mv LICENSE /tmp/LICENSE
          git checkout dev-package
          mv /tmp/README.md README.md
          mv /tmp/LICENSE LICENSE
          git add README.md
          git add LICENSE
          if [[ -d "Examples" ]]; then
            git mv Examples Samples~
            rm -f Examples.meta
          fi
          if [[ -d "WebGL Example" ]]; then
            git rm -f -r "WebGL Example"
            rm -f "WebGL Example.meta"
          fi
          if [[ -d "Prefabs" ]]; then
            git rm -f -r Prefabs
            rm -f Prefabs.meta
          fi
          if [[ -d "Scripts" ]]; then
            git mv Scripts/Runtime Runtime
            git mv Scripts/Runtime.meta Runtime.meta
            git mv Scripts/Editor Editor
            git mv Scripts/Editor.meta Editor.meta
            git rm -f -r Scripts/Tests
            git rm -f Scripts/Tests.meta
            rm -f Scripts.meta
          fi
          git config --global user.name 'github-bot'
          git config --global user.email 'github-bot@users.noreply.github.com'
          git commit -am "Packaged project"
          git push -f -u origin dev-package
        env:
          PKG_ROOT: Assets/Hertzole/Gold Player

      - name: Read package metadata
        run: |
          package_name="$(jq -r '.name' package.json)"
          package_version="$(jq -r '.version' package.json)"

          echo "PACKAGE_NAME=$package_name" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

          printf 'Package name: %s\n' "$package_name"
          printf 'Package version: %s\n' "$package_version"

      - name: Install Unity UPM CLI
        run: |
          curl -fsSL https://cdn.packages.unity.com/upm-cli/install.sh -o install.sh
          bash install.sh
          echo "$HOME/.upm/bin" >> "$GITHUB_PATH"
          rm install.sh

      - name: Sign package
        run: |
          mkdir -p "$DIST_DIR"
          upm pack ./ --organization-id "$UPM_ORG_ID" --destination "$DIST_DIR"

      - name: Print signed package info
        run: |
          shopt -s nullglob
          archives=("$DIST_DIR"/*.tgz "$DIST_DIR"/*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            printf 'Expected exactly one signed package archive, found %s\n' "${#archives[@]}" >&2
            exit 1
          fi

          archive="${archives[0]}"
          tar -tzf "$archive" | grep -qx 'package/package.json'
          tar -tzf "$archive" | grep -qx 'package/.attestation.p7m'

          echo "PACKAGE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          printf 'Archive: %s\n' "$(basename "$archive")"
          tar -xOzf "$archive" package/package.json | jq '{name, version}'

      - name: Upload signed package
        uses: actions/upload-artifact@v7
        with:
          name: signed-upm-package
          path: ${{ env.PACKAGE_ARCHIVE }}
